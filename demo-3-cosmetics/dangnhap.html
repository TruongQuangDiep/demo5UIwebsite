<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Thành Viên - GlowAura Beauty</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 flex flex-col min-h-screen">

    <!-- Header Component -->
    <div id="site-header-container" class="sticky top-0 z-50 w-full"></div>

    <!-- Main Content -->
    <main class="w-full flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-stone-200 shadow-xl space-y-6">
            
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-700 flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
                    <i class="fa-solid fa-sparkles"></i>
                </div>
                <h1 class="text-2xl font-serif font-black text-stone-900">Đăng Nhập GlowAura</h1>
                <p class="text-xs text-stone-500 mt-1">Quản lý lịch sử phác đồ da, tích lũy điểm VIP và theo dõi đơn hàng</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1">Email hoặc Số điện thoại *</label>
                    <input type="text" id="login-account" required placeholder="example@email.com hoặc 0912..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-amber-600">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-bold text-stone-700">Mật khẩu *</label>
                        <a href="#" class="text-[11px] text-amber-700 hover:underline">Quên mật khẩu?</a>
                    </div>
                    <input type="password" required placeholder="Nhập mật khẩu..." class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-amber-600">
                </div>

                <div class="flex items-center justify-between text-xs text-stone-600">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded text-amber-600 focus:ring-amber-500">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                </div>

                <button type="submit" class="w-full py-3.5 bg-stone-900 hover:bg-stone-800 text-amber-400 font-bold text-xs uppercase tracking-wider rounded-xl shadow-md transition">
                    Đăng Nhập Ngay
                </button>
            </form>

            <div class="flex items-center my-4">
                <div class="flex-grow border-t border-stone-200"></div>
                <span class="px-4 text-[11px] font-bold text-stone-400 uppercase tracking-widest whitespace-nowrap">Hoặc tiếp tục với</span>
                <div class="flex-grow border-t border-stone-200"></div>
            </div>

            <!-- Official 4-color Google SVG button -->
            <button onclick="handleGoogleMockAuth()" class="w-full py-3 px-4 border border-stone-200 hover:border-amber-400 rounded-xl flex items-center justify-center gap-3 text-xs font-semibold text-stone-700 hover:bg-stone-50 transition shadow-sm">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Đăng nhập với Google</span>
            </button>

            <p class="text-xs text-center text-stone-500">
                Chưa có tài khoản? <a href="dangky.html" class="font-bold text-amber-700 hover:underline">Đăng ký thành viên mới &rarr;</a>
            </p>

        </div>
    </main>

    <!-- Footer Container -->
    <div id="site-footer-container"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        function handleGoogleMockAuth() {
            showToast({
                title: "Đăng nhập Google thành công!",
                message: "Chào mừng bạn quay trở lại GlowAura qua tài khoản Google.",
                type: "success"
            });
            setTimeout(() => { navigateTo('index.html'); }, 1200);
        }
    </script>
</body>
</html>
