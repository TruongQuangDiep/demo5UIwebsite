<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Thành Viên - NORDICLIVING</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        stone: {
                            850: '#211f1d',
                            950: '#141210',
                        },
                        amber: {
                            750: '#92400e',
                            850: '#78350f',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#FAF9F5] text-stone-900 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="site-header-container" class="sticky top-0 z-50 w-full"></div>

    <!-- Main Content -->
    <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 flex-grow flex items-center justify-center">
        
        <div class="bg-white rounded-3xl border border-stone-200 p-8 sm:p-12 shadow-md max-w-md w-full space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-amber-700 text-white flex items-center justify-center mx-auto text-xl shadow-md">
                    <i class="fa-solid fa-gift"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-serif font-bold text-stone-900">Đăng Ký Thành Viên</h1>
                <p class="text-xs text-stone-500">Gia nhập cộng đồng Hygge Living & nhận ngay Voucher 500.000₫</p>
            </div>

            <!-- Google OAuth Button -->
            <button type="button" onclick="alert('Đăng ký bằng tài khoản Google thành công!'); window.location.href='index.html';" class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl border border-stone-200 hover:border-stone-300 hover:bg-stone-50 transition shadow-sm text-xs font-bold text-stone-700">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Đăng ký nhanh với Google</span>
            </button>

            <div class="flex items-center gap-3">
                <div class="h-[1px] flex-1 bg-stone-200"></div>
                <span class="text-[11px] text-stone-400 uppercase font-semibold">Hoặc điền thông tin</span>
                <div class="h-[1px] flex-1 bg-stone-200"></div>
            </div>

            <!-- Registration Form -->
            <form class="space-y-4" onsubmit="event.preventDefault(); alert('Đăng ký tài khoản thành công! Mã voucher NORDIC500 đã được thêm vào tài khoản của bạn.'); window.location.href='index.html';">
                <div>
                    <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">Họ và tên *</label>
                    <input type="text" required placeholder="Nguyễn Văn A" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-xs text-stone-900 focus:outline-none focus:border-amber-700">
                </div>

                <div>
                    <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">Số điện thoại *</label>
                    <input type="tel" required placeholder="0912 345 678" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-xs text-stone-900 focus:outline-none focus:border-amber-700">
                </div>

                <div>
                    <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">Địa chỉ Email *</label>
                    <input type="email" required placeholder="your.name@gmail.com" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-xs text-stone-900 focus:outline-none focus:border-amber-700">
                </div>

                <div>
                    <label class="block text-xs font-bold text-stone-700 uppercase tracking-wider mb-1.5">Mật khẩu *</label>
                    <input type="password" required placeholder="Tối thiểu 6 ký tự" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-4 py-2.5 text-xs text-stone-900 focus:outline-none focus:border-amber-700">
                </div>

                <div class="p-3 bg-amber-50 rounded-xl border border-amber-200/80 flex items-center gap-2 text-xs text-amber-900">
                    <i class="fa-solid fa-gift text-amber-700 text-sm"></i>
                    <span>Tặng ngay mã <strong>NORDIC500</strong> giảm 500K cho đơn hàng đầu tiên!</span>
                </div>

                <button type="submit" class="w-full bg-stone-900 hover:bg-amber-800 text-white font-bold text-xs uppercase tracking-wider py-3.5 rounded-xl transition shadow-md">
                    Hoàn Tất Đăng Ký
                </button>
            </form>

            <div class="text-center text-xs text-stone-500 pt-2 border-t border-stone-100">
                Đã có tài khoản NordicLiving? 
                <a href="dangnhap.html" class="font-bold text-amber-800 hover:underline ml-1">Đăng nhập ngay</a>
            </div>
        </div>

    </main>

    <!-- Footer Container -->
    <div id="site-footer-container"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
