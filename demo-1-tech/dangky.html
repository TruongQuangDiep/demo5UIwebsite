<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Thành Viên - TechPulse Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/cellphones.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
    <!-- Lucide Icons (Modern Minimalist Icon Family) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Header Container -->
    <div id="site-header-container" class="sticky top-0 z-50 w-full"></div>

    <!-- Main Content -->
    <main class="w-full flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-5">
            
            <div class="text-center">
                <div class="flex items-center justify-center mb-3">
                    <a href="index.html" class="inline-flex items-center group">
                        <img src="images/icons/AL.png" alt="SDLC Platform" class="h-10 w-auto object-contain group-hover:scale-105 transition-transform">
                    </a>
                </div>
                <span class="bg-amber-100 text-amber-800 text-[11px] font-bold px-3 py-1 rounded-full inline-block mb-2">
                    <i data-lucide="gift" class="w-3.5 h-3.5 inline mr-1"></i> Tặng Voucher 500.000₫ Ngay
                </span>
                <h1 class="text-2xl font-black text-slate-900">Đăng Ký Thành Viên Mới</h1>
                <p class="text-xs text-slate-500 mt-1">Trở thành thành viên SDLC Member để nhận vô vàn đặc quyền</p>
            </div>

            <!-- Form -->
            <form id="register-form" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Họ và tên của bạn</label>
                    <input type="text" id="reg-name" required placeholder="Nguyễn Văn A" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Số điện thoại</label>
                        <input type="tel" id="reg-phone" required placeholder="0987 654 321" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
                        <input type="email" id="reg-email" required placeholder="a@gmail.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu</label>
                    <input type="password" id="reg-pwd" required placeholder="Tối thiểu 6 ký tự" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nhập lại mật khẩu</label>
                    <input type="password" id="reg-pwd-confirm" required placeholder="Nhập lại mật khẩu trên" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-blue-500">
                </div>

                <div class="flex items-start gap-2 pt-1 text-xs text-slate-600">
                    <input type="checkbox" required class="rounded text-blue-600 mt-0.5">
                    <span>Tôi đồng ý với các <a href="#" class="text-blue-600 underline">Điều khoản dịch vụ</a> và <a href="#" class="text-blue-600 underline">Chính sách bảo mật</a> của TechPulse</span>
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#FDE047] via-[#FACC15] to-[#EAB308] hover:from-[#FACC15] hover:to-[#CA8A04] text-[#1D1D20] font-extrabold text-xs sm:text-sm rounded-xl shadow-md shadow-amber-300/40 border border-amber-300 transition mt-2">
                    Hoàn Tất Đăng Ký
                </button>
            </form>

            <p class="text-xs text-center text-slate-500 pt-2">
                Đã có tài khoản? <a href="dangnhap.html" class="font-bold text-amber-600 hover:text-amber-700 hover:underline">Đăng nhập tại đây</a>
            </p>

        </div>
    </main>

    <!-- Footer Container -->
    <div id="site-footer-container"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
