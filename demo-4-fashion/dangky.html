<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Thành Viên VIP - URBANVIBE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #14151c;
            background-image: radial-gradient(ellipse 70% 35% at 50% 0%, rgba(245, 158, 11, 0.05), transparent 70%);
        }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-[#14151c] text-white flex flex-col min-h-screen">

    <!-- Header Component -->
    <div id="site-header-container" class="sticky top-0 z-50 w-full"></div>

    <!-- Main Content -->
    <main class="w-full flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-[#1c1d27] rounded-3xl p-8 border border-zinc-700/80 shadow-2xl space-y-6">
            
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-amber-400 text-black flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg shadow-amber-400/20 font-black">
                    <i class="fa-solid fa-gift"></i>
                </div>
                <h1 class="text-2xl font-display font-black text-white uppercase">Tạo Tài Khoản VIP Drop</h1>
                <p class="text-xs text-zinc-400 mt-1">Gia nhập cộng đồng UrbanVibe nhận ngay voucher <strong class="text-amber-400">GIẢM 100K</strong></p>
            </div>

            <form id="register-form" onsubmit="event.preventDefault(); alert('Đăng ký thành công! Mã STREET100 đã được tặng vào tài khoản của bạn.'); navigateTo('index.html');" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase tracking-wider">Họ và tên của bạn *</label>
                    <input type="text" required placeholder="Nguyễn Văn A..." class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400 placeholder-zinc-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase tracking-wider">Địa chỉ Email *</label>
                    <input type="email" required placeholder="emailcuaban@example.com..." class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400 placeholder-zinc-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase tracking-wider">Số điện thoại *</label>
                    <input type="tel" required placeholder="0912 345 678..." class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400 placeholder-zinc-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-300 mb-1 uppercase tracking-wider">Mật khẩu *</label>
                    <input type="password" required placeholder="Tối thiểu 6 ký tự..." class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400 placeholder-zinc-500">
                </div>

                <div class="flex items-start gap-2 pt-1">
                    <input type="checkbox" required id="agree-terms" checked class="mt-1 text-amber-400 focus:ring-amber-400 rounded bg-zinc-950 border-zinc-700">
                    <label for="agree-terms" class="text-[11px] text-zinc-400 leading-snug">
                        Tôi đồng ý với các điều khoản dịch vụ và chính sách bảo mật của UrbanVibe Studio.
                    </label>
                </div>

                <button type="submit" class="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-black font-black text-xs uppercase tracking-wider rounded-xl transition shadow-lg shadow-amber-400/20">
                    Đăng Ký & Nhận 100K
                </button>
            </form>

            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-zinc-700"></div>
                <span class="px-4 text-[11px] font-bold text-zinc-400 uppercase tracking-widest whitespace-nowrap">Hoặc tiếp tục với</span>
                <div class="flex-grow border-t border-zinc-700"></div>
            </div>

            <!-- Google OAuth Button -->
            <button onclick="alert('Đăng ký nhanh với Google thành công! Mã STREET100 đã sẵn sàng.'); navigateTo('index.html');" class="w-full py-3 bg-zinc-950 hover:bg-zinc-850 border border-zinc-700 rounded-xl flex items-center justify-center gap-3 transition">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span class="text-xs font-bold text-zinc-200">Đăng ký nhanh với Google</span>
            </button>

            <p class="text-center text-xs text-zinc-400">
                Đã có tài khoản? <a href="dangnhap.html" class="font-bold text-amber-400 hover:underline">Đăng nhập</a>
            </p>

        </div>
    </main>

    <!-- Footer Component -->
    <div id="site-footer-container"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
