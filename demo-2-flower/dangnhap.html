<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Thành Viên - Blossom & Bloom</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            900: '#881337',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-rose-50/30 text-slate-800 flex flex-col min-h-screen font-sans selection:bg-rose-500 selection:text-white">

    <!-- Header Component -->
    <div id="site-header-container" class="sticky top-0 z-50 w-full"></div>

    <!-- Main Content -->
    <main class="w-full flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-rose-100 shadow-xl space-y-6">
            
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
                    <i class="fa-solid fa-spa"></i>
                </div>
                <h1 class="text-2xl font-serif font-black text-slate-900">Đăng Nhập Thành Viên</h1>
                <p class="text-xs text-slate-500 mt-1">Theo dõi đơn hoa, tích điểm và nhận ưu đãi riêng dịp sinh nhật</p>
            </div>

            <!-- Form -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email hoặc Số điện thoại</label>
                    <div class="relative">
                        <input type="text" id="login-account" required placeholder="demo@blossombloom.vn" class="w-full bg-rose-50/40 border border-rose-200 rounded-xl pl-10 pr-4 py-2.5 text-xs focus:outline-none focus:border-rose-500">
                        <i class="fa-regular fa-envelope absolute left-3.5 top-3 text-xs text-rose-400"></i>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-slate-700">Mật khẩu</label>
                        <button type="button" onclick="openForgotModal()" class="text-[11px] text-rose-600 hover:underline font-semibold">Quên mật khẩu?</button>
                    </div>
                    <div class="relative">
                        <input type="password" id="login-password" required value="123456" class="w-full bg-rose-50/40 border border-rose-200 rounded-xl pl-10 pr-10 py-2.5 text-xs focus:outline-none focus:border-rose-500">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3 text-xs text-rose-400"></i>
                        <button type="button" onclick="togglePasswordVisibility('login-password', 'eye-icon')" class="absolute right-3.5 top-2.5 text-slate-400 hover:text-slate-600 text-xs">
                            <i id="eye-icon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-600">
                        <input type="checkbox" checked class="rounded text-rose-600">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-rose-600 to-pink-500 hover:from-rose-700 hover:to-pink-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-rose-500/25 transition">
                    Đăng Nhập Ngay
                </button>
            </form>

            <!-- Social Logins -->
            <div class="relative my-4">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-rose-100"></div></div>
                <div class="relative flex justify-center text-[11px] uppercase"><span class="bg-white px-2 text-slate-400 font-semibold">Hoặc tiếp tục với</span></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="handleSocialLogin('Google')" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-200 hover:bg-rose-50/50 transition text-xs font-semibold text-slate-700 shadow-sm">
                    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Google</span>
                </button>
                <button type="button" onclick="handleSocialLogin('Apple')" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-200 hover:bg-rose-50/50 transition text-xs font-semibold text-slate-700">
                    <i class="fa-brands fa-apple text-slate-900 text-sm"></i> Apple
                </button>
            </div>

            <p class="text-xs text-center text-slate-500">
                Chưa có tài khoản? <a href="dangky.html" class="font-bold text-rose-600 hover:underline">Đăng ký thành viên mới</a>
            </p>

        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
            <h3 class="text-lg font-serif font-bold text-slate-900">Khôi Phục Mật Khẩu</h3>
            <p class="text-xs text-slate-500 leading-relaxed">Nhập địa chỉ email đăng ký để nhận liên kết tạo mật khẩu mới</p>
            <input type="email" id="forgot-email" placeholder="email@example.com" class="w-full bg-rose-50/40 border border-rose-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-rose-500">
            <div class="flex gap-2">
                <button onclick="closeForgotModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">Đóng</button>
                <button onclick="sendForgotEmail()" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition">Gửi liên kết</button>
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="site-footer-container"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
