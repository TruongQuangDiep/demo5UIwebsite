<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Thành Viên - Blossom & Bloom</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            900: '#881337',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-rose-50/30 text-slate-800 flex flex-col min-h-screen font-sans selection:bg-rose-500 selection:text-white">

    <!-- Header Component -->
    <div id="site-header-container" class="sticky top-0 z-50 w-full"></div>

    <!-- Main Content -->
    <main class="w-full flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-rose-100 shadow-xl space-y-5">
            
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
                    <i class="fa-solid fa-gift"></i>
                </div>
                <h1 class="text-2xl font-serif font-black text-slate-900">Đăng Ký Thành Viên</h1>
                <p class="text-xs text-rose-600 font-bold mt-1">Tặng ngay voucher 50.000₫ cho đơn hoa đầu tiên</p>
            </div>

            <!-- Form -->
            <form id="register-form" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Họ và tên của bạn</label>
                    <input type="text" id="reg-name" required placeholder="Nguyễn Thị Mai" class="w-full bg-rose-50/40 border border-rose-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-rose-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Số điện thoại</label>
                        <input type="tel" id="reg-phone" required placeholder="0987 654 321" class="w-full bg-rose-50/40 border border-rose-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-rose-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
                        <input type="email" id="reg-email" required placeholder="mai@gmail.com" class="w-full bg-rose-50/40 border border-rose-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-rose-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu</label>
                    <input type="password" id="reg-pwd" required placeholder="Tối thiểu 6 ký tự" class="w-full bg-rose-50/40 border border-rose-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-rose-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nhập lại mật khẩu</label>
                    <input type="password" id="reg-pwd-confirm" required placeholder="Xác nhận mật khẩu" class="w-full bg-rose-50/40 border border-rose-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-rose-500">
                </div>

                <div class="flex items-start gap-2 pt-1 text-xs text-slate-600">
                    <input type="checkbox" required class="rounded text-rose-600 mt-0.5">
                    <span>Tôi đồng ý với các <a href="#" class="text-rose-600 underline">Điều khoản dịch vụ</a> và <a href="#" class="text-rose-600 underline">Chính sách bảo mật</a> của tiệm hoa</span>
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-rose-600 to-pink-500 hover:from-rose-700 hover:to-pink-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-rose-500/25 transition mt-2">
                    Hoàn Tất Đăng Ký
                </button>
            </form>

            <!-- Social Registration -->
            <div class="relative my-4">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-rose-100"></div></div>
                <div class="relative flex justify-center text-[11px] uppercase"><span class="bg-white px-2 text-slate-400 font-semibold">Hoặc đăng ký nhanh với</span></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="handleSocialLogin('Google')" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-200 hover:bg-rose-50/50 transition text-xs font-semibold text-slate-700 shadow-sm">
                    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Google</span>
                </button>
                <button type="button" onclick="handleSocialLogin('Facebook')" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-200 hover:bg-rose-50/50 transition text-xs font-semibold text-slate-700 shadow-sm">
                    <i class="fa-brands fa-facebook text-[#1877F2] text-sm"></i>
                    <span>Facebook</span>
                </button>
            </div>

            <p class="text-xs text-center text-slate-500 pt-2">
                Đã có tài khoản? <a href="dangnhap.html" class="font-bold text-rose-600 hover:underline">Đăng nhập tại đây</a>
            </p>

        </div>
    </main>

    <!-- Footer Container -->
    <div id="site-footer-container"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
